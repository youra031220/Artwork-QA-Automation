name: P0 parser smoke tests
on:
  push:
    paths:
      - 'excel_loader.py'
      - 'product_parser.py'
      - 'product_identity.py'
      - 'app.py'
      - 'test_p0.py'
      - '.github/workflows/p0-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf
      - run: python -m unittest -v test_p0
      - run: python -m py_compile app.py extractor.py layout.py product_identity.py pdf_overlay.py excel_loader.py product_parser.py
